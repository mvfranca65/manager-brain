<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager HQ — Project Brain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080b14;
    --surface: #0f1322;
    --card: #141828;
    --card-hover: #1a1f35;
    --border: #1e2540;
    --border-hover: #2d3658;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #475569;
    --accent-green: #22c55e;
    --accent-purple: #8b5cf6;
    --accent-blue: #4f46e5;
    --accent-pink: #ec4899;
    --accent-orange: #f97316;
    --accent-cyan: #06b6d4;
    --accent-yellow: #eab308;
    --accent-red: #ef4444;
    --tech-color: #22c55e;
    --mkt-color: #ec4899;
    --gestao-color: #f97316;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    padding: 40px 60px;
    min-height: 100vh;
  }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
  .header h1 { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; letter-spacing: -1px; }
  .header .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 6px 16px; border-radius: 20px; letter-spacing: 1.5px; font-weight: 600; }
  .badge-green { border: 1.5px solid var(--accent-green); color: var(--accent-green); }
  .badge-orange { border: 1.5px solid var(--accent-orange); color: var(--accent-orange); }
  .badge-purple { border: 1.5px solid var(--accent-purple); color: var(--accent-purple); }
  .badge-cyan { border: 1.5px solid var(--accent-cyan); color: var(--accent-cyan); }
  .badge-red { border: 1.5px solid var(--accent-red); color: var(--accent-red); }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 36px; background: var(--surface); border-radius: 8px; padding: 4px; width: fit-content; flex-wrap: wrap; }
  .tab { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 10px 24px; border: none; background: none; color: var(--text-muted); cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 6px; transition: all 0.2s; font-weight: 500; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent-blue); color: white; font-weight: 600; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Sub-tabs */
  .sub-tabs { display: flex; gap: 0; margin-bottom: 28px; background: var(--surface); border-radius: 8px; padding: 4px; width: fit-content; flex-wrap: wrap; }
  .sub-tab { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 8px 20px; border: none; background: none; color: var(--text-muted); cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 6px; transition: all 0.2s; }
  .sub-tab:hover { color: var(--text); }
  .sub-tab.active-tech { background: var(--tech-color); color: white; }
  .sub-tab.active-mkt { background: var(--mkt-color); color: white; }
  .sub-tab.active-gestao { background: var(--gestao-color); color: white; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
  .stat-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
  .stat-green { color: var(--accent-green); }
  .stat-purple { color: var(--accent-purple); }
  .stat-cyan { color: var(--accent-cyan); }
  .stat-orange { color: var(--accent-orange); }
  .stat-yellow { color: var(--accent-yellow); }

  /* Section headers */
  .section-header { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--tech-color); margin: 36px 0 20px; font-weight: 600; }
  .section-header.mkt { color: var(--mkt-color); }
  .section-header.gestao { color: var(--gestao-color); }
  .section-header.purple { color: var(--accent-purple); }
  .section-header.cyan { color: var(--accent-cyan); }
  .section-header.orange { color: var(--accent-orange); }
  .section-header.yellow { color: var(--accent-yellow); }

  /* Product cards */
  .product-section { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; margin-bottom: 24px; }
  @media (max-width: 900px) { .product-section { grid-template-columns: 1fr; } }
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; }
  .product-card h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
  .product-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; }
  .tech-tags { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .tech-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 5px 14px; border-radius: 20px; background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); letter-spacing: 1px; border: 1px solid rgba(6, 182, 212, 0.3); }

  /* Pillar bars */
  .pillar-title { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }
  .pillar { display: flex; align-items: center; margin-bottom: 10px; gap: 12px; }
  .pillar-name { font-size: 0.85rem; min-width: 130px; }
  .pillar-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .pillar-fill { height: 100%; border-radius: 3px; }
  .pillar-fill.purple { background: var(--accent-purple); }
  .pillar-fill.cyan { background: var(--accent-cyan); }
  .pillar-fill.green { background: var(--accent-green); }
  .pillar-fill.yellow { background: var(--accent-yellow); }
  .pillar-pct { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); min-width: 32px; text-align: right; }

  /* Pricing card */
  .pricing-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  @media (max-width: 900px) { .pricing-grid { grid-template-columns: 1fr; } }
  .pricing-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; }
  .pricing-card .label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .pricing-card .value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .pricing-card .value-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
  .pricing-card .note { font-size: 0.78rem; color: var(--text-dim); margin-top: 12px; }
  .pricing-card.entry .value { color: var(--accent-green); }
  .pricing-card.monthly .value { color: var(--accent-cyan); }
  .pricing-card.contract .value { color: var(--accent-purple); }

  /* Agent cards */
  .agent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 16px; }
  @media (max-width: 1100px) { .agent-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .agent-grid { grid-template-columns: 1fr; } }
  .agent-grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 700px) { .agent-grid-2 { grid-template-columns: 1fr; } }
  .agent-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 26px; cursor: pointer; transition: all 0.2s; position: relative; }
  .agent-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); background: var(--card-hover); }
  .agent-card.mkt:hover { border-color: var(--mkt-color); }
  .agent-card.gestao:hover { border-color: var(--gestao-color); }
  .agent-card .emoji { font-size: 1.8rem; margin-bottom: 12px; display: block; }
  .agent-card h4 { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
  .agent-card .role { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .agent-card .desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
  .agent-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--accent-blue); color: var(--accent-blue); display: inline-block; }
  .agent-tag.mkt { border-color: var(--mkt-color); color: var(--mkt-color); }
  .agent-tag.gestao { border-color: var(--gestao-color); color: var(--gestao-color); }
  .agent-card.donna-highlight { border: 1px solid var(--accent-yellow); }

  /* Team info */
  .team-info { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 28px; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 760px; max-width: 92vw; max-height: 88vh; overflow-y: auto; position: relative; }
  .modal-header { display: flex; align-items: center; gap: 16px; padding: 28px 32px 0; }
  .modal-header .emoji { font-size: 2.4rem; }
  .modal-header-text h3 { font-size: 1.3rem; font-weight: 700; }
  .modal-header-text .role { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-green); }
  .modal-header-text .role.mkt { color: var(--mkt-color); }
  .modal-header-text .role.gestao { color: var(--accent-orange); }
  .modal-close { position: absolute; top: 18px; right: 22px; background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: white; }
  .modal-body { padding: 24px 32px; }
  .modal-prompt { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 0 32px 28px; }
  .btn { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 10px 24px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s; }
  .btn-ghost { background: none; color: var(--text-muted); }
  .btn-ghost:hover { color: white; border-color: var(--text-muted); }
  .btn-primary { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
  .btn-primary:hover { background: #4338ca; }

  /* Brain tab */
  .brain-search-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .brain-search { flex: 1; min-width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
  .brain-search:focus { border-color: var(--accent-cyan); }
  .brain-search::placeholder { color: var(--text-dim); }
  .brain-filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text-muted); cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
  .filter-chip:hover { color: var(--text); border-color: var(--border-hover); }
  .filter-chip.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

  .brain-sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
  .brain-section-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 26px; }
  .brain-section-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .brain-section-card .section-emoji { font-size: 1.3rem; }
  .brain-section-card .section-count { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 1.5px; color: var(--text-muted); margin-left: auto; }
  .brain-file { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; padding: 6px 0; display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(30, 37, 64, 0.4); }
  .brain-file:last-child { border-bottom: none; }
  .brain-file .file-name { color: var(--text); flex: 1; min-width: 0; word-break: break-word; }
  .brain-file .file-icon { color: var(--text-muted); margin-right: 6px; }
  .brain-file .file-owner { color: var(--text-dim); font-size: 0.7rem; white-space: nowrap; }
  .brain-file .file-status { font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .brain-file .status-active { background: rgba(34,197,94,0.15); color: var(--accent-green); }
  .brain-file .status-backlog { background: rgba(249,115,22,0.15); color: var(--accent-orange); }
  .brain-file .status-superseded { background: rgba(100,116,139,0.2); color: var(--text-muted); }
  .brain-file .status-critical { background: rgba(239,68,68,0.15); color: var(--accent-red); }
  .brain-file .file-desc { color: var(--text-muted); font-size: 0.7rem; margin-top: 2px; }
  .brain-empty { color: var(--text-dim); font-size: 0.8rem; font-style: italic; padding: 8px 0; }

  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--accent-cyan); cursor: pointer; margin-bottom: 10px; transition: border-color 0.2s; }
  .code-block:hover { border-color: var(--accent-cyan); }

  /* Features tab */
  .feature-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 16px; }
  @media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; } }
  .feature-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; transition: border-color 0.2s; }
  .feature-card:hover { border-color: var(--border-hover); }
  .feature-card h4 { font-size: 1rem; margin-bottom: 4px; }
  .feature-card .path { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--accent-purple); margin-bottom: 8px; word-break: break-all; }
  .feature-card .desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }
  .feature-card .docs { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .feature-card .doc-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 3px 8px; border-radius: 4px; background: rgba(139, 92, 246, 0.12); color: var(--accent-purple); }
  .feature-card .status-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 3px 8px; border-radius: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .feature-card .status-done { background: rgba(34,197,94,0.15); color: var(--accent-green); }
  .feature-card .status-mvp2 { background: rgba(249,115,22,0.15); color: var(--accent-orange); }
  .feature-card .status-active { background: rgba(6,182,212,0.15); color: var(--accent-cyan); }

  /* Sprint tab */
  .sprint-header { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 24px; }
  .sprint-header h3 { font-size: 1.2rem; margin-bottom: 4px; }
  .sprint-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
  .sprint-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 4px 12px; border-radius: 12px; display: inline-block; margin-top: 8px; letter-spacing: 1px; font-weight: 600; }
  .sprint-badge.active { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
  .sprint-badge.done { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
  .sprint-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .sprint-table th { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); padding: 14px 16px; text-align: left; background: var(--surface); border-bottom: 1px solid var(--border); }
  .sprint-table td { font-size: 0.85rem; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sprint-table tr:last-child td { border-bottom: none; }
  .status-done { color: var(--accent-green); }
  .status-active { color: var(--accent-cyan); }
  .status-planned { color: var(--accent-orange); }
  .status-blocked { color: var(--accent-red); }

  /* Decisions */
  .decision-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 12px; }
  .decision-card .date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1px; }
  .decision-card .title { font-size: 0.95rem; font-weight: 600; margin: 4px 0; }
  .decision-card .body { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Manager HQ</h1>
    <div class="subtitle">iManager &middot; Trivion &middot; Marvel &middot; HIMYM &middot; Suits &middot; 26 Agentes</div>
  </div>
  <div class="badges">
    <span class="badge badge-green">MVP1 &middot; Entregue</span>
    <span class="badge badge-cyan">Pré-Lançamento</span>
    <span class="badge badge-orange">MVP2 &middot; Em rota</span>
    <span class="badge badge-purple">Brain v3</span>
  </div>
</div>

<div class="tabs" id="mainTabs"></div>
<div id="tabContents"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-header">
      <span class="emoji" id="modalEmoji"></span>
      <div class="modal-header-text">
        <h3 id="modalName"></h3>
        <div class="role" id="modalRole"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-prompt" id="modalPrompt"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" onclick="copyPrompt()">Copiar prompt</button>
    </div>
  </div>
</div>

<script>
// ===================== DATA =====================

const PILARES = [
  { name: 'Atividade', pct: 25, color: 'purple' },
  { name: 'Foco', pct: 25, color: 'purple' },
  { name: 'Consistencia', pct: 20, color: 'cyan' },
  { name: 'Saude', pct: 15, color: 'green' },
  { name: 'Fragmentacao', pct: 10, color: 'yellow' },
  { name: 'Anomalias', pct: 5, color: 'cyan' },
];

// ===================== AGENTS =====================

const TECH_AGENTS = [
  {
    section: 'Scrum Master & Product',
    agents: [
      { id:'Estranho', emoji:'🌀', name:'Doutor Estranho', role:'Scrum Master', tag:'@Estranho',
        desc:'Use para organizar o trabalho: planejar sprints, conduzir dailies, retros, remover impedimentos, cobrar DoD ou documentar decisoes de processo. Responde por padrao quando ninguem e mencionado.',
        prompt:`Regra de sessao: em toda nova sessao, antes de responder ou executar qualquer tarefa, releia os arquivos obrigatorios listados abaixo.
Nao presuma que o contexto de uma sessao anterior esta disponivel.
Use .brain/kanban-codex.html como indice autoritativo para confirmar seu papel, seus arquivos obrigatorios e suas skills quando houver mudanca ou conflito.

Voce e o @Estranho, Scrum Master do time de tecnologia do Manager.

Leia e memorize estes arquivos AGORA (nesta ordem):
1. .brain/_shared/produto.md — o que e o Manager
2. .brain/_shared/contribuindo.md — fluxo de contribuicao e DoD
3. .brain/tecnologia/time.md — seu time, acordos, fluxo, regras

function filterBrain() {
  const q = (document.getElementById('brainSearch').value || '').trim().toLowerCase();
  const activeCat = document.querySelector('.filter-chip.active')?.dataset.cat || 'all';
  document.querySelectorAll('.brain-section-card').forEach(card => {
    const cat = card.dataset.cat;
    const catMatch = activeCat === 'all' || cat === activeCat;
    let anyVisible = false;
    card.querySelectorAll('.brain-file').forEach(item => {
      const name = item.dataset.name || '';
      const match = !q || name.includes(q);
      item.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    card.style.display = (catMatch && (q === '' || anyVisible)) ? '' : 'none';
  });
}

function filterBrainCat(cat, ev) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  ev.target.classList.add('active');
  filterBrain();

  if (!a) return;
  document.getElementById('modalEmoji').textContent = a.emoji;
  document.getElementById('modalName').textContent = a.name;
  const roleEl = document.getElementById('modalRole');
  roleEl.textContent = a.role;
  roleEl.className = 'role' + (teamClass === 'mkt' ? ' mkt' : teamClass === 'gestao' ? ' gestao' : '');

  const skills = AGENT_SKILLS[agentId] || [];
  let fullPrompt = a.prompt;
  if (skills.length > 0) {
    fullPrompt += `\n\nSuas skills (use com o Skill tool quando aplicavel):\n${skills.map(s => '- ' + s).join('\n')}`;
  }
  document.getElementById('modalPrompt').textContent = fullPrompt;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function copyPrompt() {
  const text = document.getElementById('modalPrompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-primary');
    const orig = btn.textContent;
    btn.textContent = 'Copiado!';
    btn.style.background = '#22c55e';
    btn.style.borderColor = '#22c55e';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.borderColor = ''; }, 1500);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ===================== INIT =====================

function init() {
  renderTabs();
  document.getElementById('tabContents').innerHTML =
    renderOverview() + renderTime() + renderFeatures() + renderServices() + renderBrain() + renderSprint();
}

init();
</script>
</body>
</html>
